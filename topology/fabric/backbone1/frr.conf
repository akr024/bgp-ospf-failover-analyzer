frr version 10.7.1_git
frr defaults traditional
hostname backbone1
service integrated-vtysh-config
!
ip prefix-list FABRIC-LOOPBACKS seq 5 permit 10.255.0.0/24 le 32
!
route-map FROM-FABRIC permit 10
 match ip address prefix-list FABRIC-LOOPBACKS
exit
!
interface eth1
 ip address 10.0.35.2/30
exit
!
interface eth2
 ip address 10.0.56.1/30
exit
!
interface lo
 ip address 10.255.0.5/32
exit
!
router bgp 65100
 neighbor 10.0.35.1 remote-as 65001
 neighbor 10.0.56.2 remote-as 65100
 !
 address-family ipv4 unicast
  neighbor 10.0.35.1 route-map FROM-FABRIC in
  neighbor 10.0.56.2 next-hop-self
 exit-address-family
exit
!
