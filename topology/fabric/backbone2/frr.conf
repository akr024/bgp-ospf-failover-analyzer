frr version 10.7.1_git
frr defaults traditional
hostname backbone2
service integrated-vtysh-config
!
ip prefix-list FABRIC-LOOPBACKS seq 5 permit 10.255.0.0/24 le 32
ip prefix-list BACKBONE-EDGE seq 5 permit 10.0.35.0/30
ip prefix-list BACKBONE-EDGE seq 10 permit 10.0.36.0/30
ip prefix-list BACKBONE-EDGE seq 15 permit 10.0.45.0/30
ip prefix-list BACKBONE-EDGE seq 20 permit 10.0.46.0/30
ip prefix-list BACKBONE-EDGE seq 25 permit 10.255.0.5/32
ip prefix-list BACKBONE-EDGE seq 30 permit 10.255.0.6/32
!
route-map FROM-FABRIC permit 10
 match ip address prefix-list FABRIC-LOOPBACKS
exit
!
route-map TO-FABRIC permit 10
 match ip address prefix-list BACKBONE-EDGE
exit
!
interface eth1
 ip address 10.0.46.2/30
exit
!
interface eth2
 ip address 10.0.56.2/30
exit
!
interface eth3
 ip address 10.0.36.2/30
exit
!
interface lo
 ip address 10.255.0.6/32
exit
!
router bgp 65100
 neighbor 10.0.36.1 remote-as 65001
 neighbor 10.0.46.1 remote-as 65001
 neighbor 10.0.56.1 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.0.36.0/30
  network 10.0.46.0/30
  network 10.255.0.6/32
  neighbor 10.0.36.1 route-map FROM-FABRIC in
  neighbor 10.0.36.1 route-map TO-FABRIC out
  neighbor 10.0.46.1 route-map FROM-FABRIC in
  neighbor 10.0.46.1 route-map TO-FABRIC out
  neighbor 10.0.56.1 next-hop-self
 exit-address-family
exit
!
