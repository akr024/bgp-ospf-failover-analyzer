name: fabric

topology:
  nodes:
    leaf1:
      kind: linux
      image: frr-ssh2:latest
      mgmt-ipv4: 172.20.20.4
      binds:
        - leaf1:/etc/frr
      exec:
        - /usr/sbin/sshd
        - /bin/sh -c "ip route del default via 172.20.20.1 dev eth0 2>/dev/null || true"

    leaf2:
      kind: linux
      image: frr-ssh2:latest
      mgmt-ipv4: 172.20.20.5
      binds:
        - leaf2:/etc/frr
      exec:
        - /usr/sbin/sshd
        - /bin/sh -c "ip route del default via 172.20.20.1 dev eth0 2>/dev/null || true"

    spine1:
      kind: linux
      image: frr-ssh2:latest
      mgmt-ipv4: 172.20.20.2
      binds:
        - spine1:/etc/frr
      exec:
        - /usr/sbin/sshd

    spine2:
      kind: linux
      image: frr-ssh2:latest
      mgmt-ipv4: 172.20.20.6
      binds:
        - spine2:/etc/frr
      exec:
        - /usr/sbin/sshd

    backbone1:
      kind: linux
      image: frr-ssh2:latest
      mgmt-ipv4: 172.20.20.7
      binds:
        - backbone1:/etc/frr
      exec:
        - /usr/sbin/sshd

    backbone2:
      kind: linux
      image: frr-ssh2:latest
      mgmt-ipv4: 172.20.20.3
      binds:
        - backbone2:/etc/frr
      exec:
        - /usr/sbin/sshd

  links:
    - endpoints: ["leaf1:eth1", "spine1:eth1"]
    - endpoints: ["leaf1:eth2", "spine2:eth1"]
    - endpoints: ["leaf2:eth1", "spine1:eth2"]
    - endpoints: ["leaf2:eth2", "spine2:eth2"]

    - endpoints: ["spine1:eth3", "backbone1:eth1"]
    - endpoints: ["spine1:eth4", "backbone2:eth3"]

    - endpoints: ["spine2:eth3", "backbone2:eth1"]
    - endpoints: ["spine2:eth4", "backbone1:eth3"]

    - endpoints: ["backbone1:eth2", "backbone2:eth2"]
